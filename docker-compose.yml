services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kubeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubeai}
      POSTGRES_DB: ${POSTGRES_DB:-kubeai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kubeai}:${POSTGRES_PASSWORD:-kubeai}@db:5432/${POSTGRES_DB:-kubeai}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VAULT_PATH: /app/Vault
      additional_contexts:
        # Build-time context nomeado "vault": expõe o Vault ao Dockerfile via
        # `RUN --mount=type=bind,from=vault` durante `npm run build`. Isto é
        # necessário porque o `generateStaticParams` (SSG) invoca
        # `loadTopicBySlug` 113 vezes — sem o Vault no build, todos os tópicos
        # 404'ariam e ficavam "colados" como páginas estáticas de erro.
        # (Nota: `build.volumes` não existe no schema do compose; o idioma
        # padrão BuildKit é `additional_contexts` + `RUN --mount=type=bind`.)
        vault: ../Vault
    ports:
      - "3001:3000"
    env_file:
      - ./frontend/.env
    environment:
      - VAULT_PATH=/app/Vault
    volumes:
      - ../Vault:/app/Vault:ro
    restart: unless-stopped

volumes:
  pgdata: